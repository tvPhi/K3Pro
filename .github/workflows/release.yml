# Packages K3Pro.App for Windows / Linux / macOS when a GitHub Release is published (tag like v1.2.3 or 1.2.3).
# Manual run (Actions > Release packages > Run workflow): only builds artifacts for test downloads, attached to no release.
name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for a manual run (e.g. 0.1.0-test)"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write # gh release upload

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_PROJECT: src/K3Pro.App/K3Pro.App.csproj

jobs:
  test:
    # Headless Avalonia tests + golden tests from fixtures — run on Windows like the dev machine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test K3Pro.slnx -c Release

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${TAG:-$INPUT_VERSION}"
          v="${v#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag/version '$v' is not of the form 1.2.3 or 1.2.3-beta.1"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "PKG=K3Pro-$v-${{ matrix.rid }}" >> "$GITHUB_ENV"

      - name: Publish (self-contained, single file)
        run: |
          dotnet publish "$APP_PROJECT" -c Release -r "${{ matrix.rid }}" --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:Version="$VERSION" -o out/app
          rm -f out/app/*.pdb   # native SkiaSharp / HarfBuzz pdbs (~100 MB), not needed at runtime
          mkdir -p out/docs && cp LICENSE THIRD-PARTY-NOTICES.md out/docs/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out/docs/* out/app/
          Compress-Archive -Path out/app/* -DestinationPath "dist/$env:PKG.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist "out/$PKG"
          cp -r out/app/. "out/$PKG/"
          cp packaging/linux/70-k3pro.rules packaging/linux/README-linux.txt packaging/linux/k3pro.desktop packaging/linux/k3pro.png out/docs/* "out/$PKG/"
          chmod +x "out/$PKG/K3Pro.App"
          tar -czf "dist/$PKG.tar.gz" -C out "$PKG"

      - name: Package (macOS .app)
        if: runner.os == 'macOS'
        run: |
          app="out/K3Pro.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp -r out/app/. "$app/Contents/MacOS/"
          cp out/docs/* packaging/macos/K3Pro.icns "$app/Contents/Resources/"
          sed -e "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/K3Pro.App"
          xattr -cr "$app"   # strip extended attributes — otherwise ditto emits ._* files that break the signature when unzipped by tools other than Finder
          codesign --force --deep --sign - "$app"   # ad-hoc: Apple Silicon won't run unsigned binaries
          codesign --verify --deep --strict "$app"
          ditto -c -k --norsrc --noextattr --keepParent "$app" "dist/$PKG.zip"
          if unzip -l "dist/$PKG.zip" | grep -q '/\._'; then echo "::error::zip still contains AppleDouble ._* files"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PKG }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
